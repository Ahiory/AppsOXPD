<!DOCTYPE html>
<html lang="es">
<head>
    <title>Certificados laborales</title>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/bootstrap-theme.min.css">
    <script src="js/bootstrap.min.js"></script>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <link rel="stylesheet" href="style.css">
    <script src="logger.js"></script>
    <script src="libs/jquery-1.11.0.min.js"></script>
    <script src="libs/oxpddiscovery-2.6.0.min.js"></script>
    <script src="libs/oxpdprint-2.6.0.min.js"></script>
    <script src="main.js"></script>
    <link rel="shortcut icon" type="image/x-icon" href="carvajal-logo.ico" />
    
    <script type="text/javascript">
        function carta(){
            let selectedValue = document.getElementById("seleccion").value;
            alert(selectedValue);
        }
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-image: url('home-carvajal.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; 
            overflow: hidden; 
        }

        /* ==========================================
           ESTILO CRISTAL PARA LOS RECUADROS INDIVIDUALES
           ========================================== */
        .glass-box {
            position: absolute;
            left: 15%;
            width: 500px;
            height: 80px;
            margin: 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
            z-index: 1; /* Mantiene el recuadro detrás del texto */
        }
        
        /* Contenedor exacto que usabas para el texto y el botón */
        .contenedor-contenido {
            width: 450px;
            height: 70px;
            text-align: center;
            position: absolute;
            left: 18%;
            margin: 20px;
            z-index: 2; /* Coloca el texto y botón por encima del cristal */
        }

        /* Ajuste de color de texto para que sea legible sobre el cristal */
        .texto-cristal {
            text-align: left; 
            color: #005487; /* Azul corporativo */
            font-size: 20px;
            font-weight: bold;
            margin: 0; 
        }
    </style>
</head>

<body>

    <!-- Botón de cierre -->
    <div>
        <input type="image" src="cerrar.png" style="position: absolute; right: 20px; top: 20px; width: 50px; z-index: 10;" onclick="window.close();">
    </div>

    <!--  Primer recuadro -->
    <div class="glass-box" style="top: 5%;"></div>
    <div class="contenedor-contenido" style="top: 10%;">
        <p class="texto-cristal">Carta Laboral Estandar</p>
        <input type="button" value="Imprimir" onclick="main.print('http://desarrolloscarvajal.com/desarrollos/certificado/archivos/carta_salario.pdf');" style="position: absolute; left: 80%; top: -10%;" class="btn btn-success btn-lg">
    </div>

    <!--  Segundo recuadro -->
    <div class="glass-box" style="top: 25%;"></div>
    <div class="contenedor-contenido" style="top: 30%;">
        <p class="texto-cristal">Carta Laboral Estandar Sin Salario</p>
        <input type="button" value="Imprimir" onclick="main.print('http://desarrolloscarvajal.com/desarrollos/certificado/archivos/carta_sin.pdf');" style="position: absolute; left: 80%; top: -10%;" class="btn btn-success btn-lg">
    </div>

    <!--  Tercer recuadro -->
    <div class="glass-box" style="top: 45%;"></div>
    <div class="contenedor-contenido" style="top: 50%;">
        <p class="texto-cristal">Ingresos y Retenciones 2025</p>
        <input type="button" value="Imprimir" onclick="main.print('http://desarrolloscarvajal.com/desarrollos/certificado/archivos/ingresosretenciones.pdf');" style="position: absolute; left: 80%; top: -10%;" class="btn btn-success btn-lg">
    </div>

    <!-- Botón de regreso respetando proporciones -->
    <input type="button" value="Regresar" class="btn btn-warning btn-lg" style="position: absolute; left: 45%; top: 75%; z-index: 5;" onclick="location.href='inicio.html'">

</body>
</html>
