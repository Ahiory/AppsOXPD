<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Certificados laborales</title>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="image/x-icon" href="carvajal-logo.ico" />
    <style>
        /* ==========================================
           REGLA PRINCIPAL: Ocupar todo el alto y ancho
           ========================================== */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        body {
            background-image: url('home-carvajal.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; /* Cambiado a cover para un ajuste perfecto */
            font-family: Arial, sans-serif;
            overflow: hidden; 
            position: relative;
        }

        /* ==========================================
           ESTILO CRISTAL (Glassmorphism) PARA EL LOGIN
           ========================================== */
        .login-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            color: #005487; /* Texto azul para contrastar */
            text-align: left;
            box-sizing: border-box;
        }
        
        .login-card h3 {
            margin-top: 0;
            margin-bottom: 22px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        /* Ajuste de los inputs para que alineen perfecto con el cristal */
        .form-control {
            margin-bottom: 15px;
            border-radius: 6px;
            height: 40px;
            width: 100%; 
            box-sizing: border-box; 
            display: block;
            border: 1px solid rgba(0, 84, 135, 0.3); /* Borde azul muy sutil */
            background: rgba(255, 255, 255, 0.95); /* Fondo casi blanco para legibilidad */
            padding: 10px;
        }

        .btn-carvajal {
            background-color: #005487;
            border: 1px solid #004068;
            color: white;
            width: 100%; /* Alineado al 100% con los inputs */
            padding: 10px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            transition: background 0.3s ease;
            display: block;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-carvajal:hover {
            background-color: #004068;
        }

        /* ==========================================
           1. PANTALLA PEQUEÑA (Max 900px)
           ========================================== */
        @media screen and (max-width: 900px) {
            .login-card {
                width: 280px;
                padding: 25px;
                position: absolute;
                top: 20%;
                left: 30%;
                transform: translateX(-50%); /* Centrado horizontal perfecto */
                z-index: 5; 
            }
            .close-btn {
                position: absolute;
                top: 15px;
                right: 15px;
                width: 60px;
                cursor: pointer;
                z-index: 10;
            }
        }

        /* ==========================================
           2. PANTALLA GRANDE (Min 901px)
           ========================================== */
        @media screen and (min-width: 901px) {
            .login-card {
                width: 320px;
                padding: 35px;
                position: absolute;
                top: 25%;
                left: 50%;
                transform: translateX(-50%); /* Centrado horizontal perfecto */
                z-index: 5;
            }
            .close-btn {
                position: absolute;
                top: 20px;
                right: 20px;
                width: 50px;
                cursor: pointer;
                z-index: 10;
            }
        }
    </style>
</head>

<body>

    <!-- Botón de cierre -->
    <div>
       <img src="cerrar.png" class="close-btn" onclick="window.close();" alt="Cerrar">
    </div>

    <!-- Formulario de acceso con Efecto Cristal -->
    <form name="form" action="TU_PAGINA_WEB.HTML" class="login-card">
       <h3>Certificados laborales</h3>
       <input placeholder="Usuario" type="text" name="login" class="form-control">
       <input placeholder="Password" type="password" name="password" class="form-control">
       <input onclick="go()" type="button" value="Acceder" class="btn-carvajal">
    </form>

    <script language="JavaScript">
       function go() {
          if (document.form.password.value == '1234' && document.form.login.value == 'demo') {
             window.location = "inicio.html";
          } else {
             alert("Por favor ingrese nombre de Usuario y Password correctos.");
          }
       } 

       if (window.OXPd !== undefined && window.OXPd !== null) {
           window.OXPd.headerBackgroundColor = '#005487'; 
           window.OXPd.headerForegroundColor = '#FFFFFF';
           window.OXPd.footerCollapsed = true;
       }
    </script>

</body>
</html>
