        <style>
            /* 1. Ajuste del fondo para que no se repita y cubra la pantalla */
            body {
                margin: 0;
                padding: 0;
                width: 100vw;
                height: 100vh;
                background-image: url('Fondo4.png') !important;
                background-repeat: no-repeat !important;
                background-size: 100% 100% !important;
                background-position: center center !important;
                overflow: hidden;
            }

            /* 2. Centrado automático del formulario y limpieza de inputs */
            #contenedor-formulario {
                text-align: center; /* Centra el texto y los inputs automáticamente */
            }

            /* Diseño limpio y grande para el campo numérico */
            #yourid {
                display: inline-block;
                width: 120px !important;
                height: 70px !important;
                font-size: 45px !important;
                text-align: center !important;
                border-radius: 8px; /* Bordes ligeramente redondeados */
                margin: 0 auto;
            }

            /* Ocultar las molestas flechas (-/+) del navegador en el campo number */
            #yourid::-webkit-outer-spin-button,
            #yourid::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            #yourid[type=number] {
                -moz-appearance: textfield;
            }

            /* Botón de enviar alineado al centro */
            #btn-enviar {
                display: inline-block;
                margin: 0 auto;
                font-size: 25px;
            }

            /* --- CLASE NUEVA PARA EL CONTRASTE DE LAS LETRAS --- */
            .borde-texto {
                text-shadow: 
                    -2px -2px 0 #ffffff,  
                     2px -2px 0 #ffffff,
                    -2px  2px 0 #ffffff,
                     2px  2px 0 #ffffff,
                     0px  4px 8px rgba(255, 255, 255, 0.9);
            }

            /* 3. Ajustes de coordenadas para la resolución de 1024x620 */
            @media screen and (max-width: 1024px) and (max-height: 620px) {
                #btn-cerrar {
                    
                    top: 3% !important;
                }
                
                #titulo-principal {
                    top: 5% !important;
                    left: 8% !important;
                }

                #contenedor-formulario {
                    top: 24% !important;
                    
                    width: 90% !important;
                }
            }
        </style>
    </head>
    
    <body>

            <br>
                </font>

                    <input type="text" id="SerialNumber" name="serial" hidden>

                    <input type="text" id="productNumber" name="product" hidden>
                    <input type="text" id="companyContact" name="contacto" hidden>
                    <input type="text" id="companyName" name="empresa" hidden>
                    <input type="text" id="deviceLocation" name="direccion" hidden>
                    <input type="text" id="machineName" name="nombre" hidden>
                </font>
            </div>
