<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensiones de la Pantalla</title>
    <style>
        /* Estilos básicos para que la página se vea moderna y centrada */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        .contenedor {
            text-align: center;
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #555;
        }
        .dimensiones {
            font-size: 48px;
            font-weight: bold;
            color: #007BFF;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Tamaño del navegador</h1>
        <div class="dimensiones" id="pantalla-texto">
            </div>
    </div>

    <script>
        if (window.OXPd !== undefined && window.OXPd !== null) {
            // Cambiar el color de fondo de la barra superior al azul de tu diseño
            window.OXPd.headerBackgroundColor = '#005487'; 
            // Cambiar el color del texto y los iconos a blanco para mantener el contraste
            window.OXPd.headerForegroundColor = '#FFFFFF';
            window.OXPd.footerCollapsed = true;
        }
        // Seleccionamos el elemento HTML donde vamos a mostrar el texto
        const textoPantalla = document.getElementById('pantalla-texto');

        // Función que obtiene y escribe las medidas
        function actualizarDimensiones() {
            // window.innerWidth y innerHeight obtienen el espacio visible del navegador
            const ancho = window.innerWidth;
            const alto = window.innerHeight;
            
            textoPantalla.textContent = ancho + 'px × ' + alto + 'px';
        }

        // 1. Ejecutamos la función inmediatamente al cargar la página
        actualizarDimensiones();

        // 2. Le decimos al navegador que vuelva a ejecutar la función cada vez que cambies el tamaño de la ventana
        window.addEventListener('resize', actualizarDimensiones);
    </script>

</body>
</html>
