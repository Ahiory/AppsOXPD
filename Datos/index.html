<html>

<head>
    <title>Valores de Bibliotecas OXPD</title>

    <!--Se agregan las librerias para la toma de informacion servicios- manejar localmente o server 
                LIbreria principal-->
    <script src="libs/jquery-1.11.0.min.js"></script>
    <!-- Libreria para llamar informacion basica de impresora -->
    <script src="libs/oxpddeviceinfo-2.6.0.min.js"></script>
    <!-- Libreria llama a metodo basico para descubrir cada elemento de impresora-->
    <script src="libs/oxpddiscovery-2.6.0.min.js"></script>
    <!--Libreria para llamar funciones de impresion basicas -->
    <script src="libs/oxpdprint-2.6.0.min.js"></script>
    <!--Libreria para scanear ,llama a metodos y tikets -->
    <script src="libs/oxpdscan-2.6.0.min.js"></script>
    <!--llama funcion donde se ejecutan datos -->
    <script src="main.js"></script>
    <script src="main2.js"></script>

    <script type="text/javascript">
        window.onload = function() {
            //funciones a ejecutar
            getManufacturerInfo();
            getCustomerInfo();
        };
    </script>
</head>

<body>

    <div class="button" id="button_window">
        <!--Utilizar metodo onclick para invocar funcion  getManufacturerInfo();-->


        <div style="position: absolute; top: 1%; left: 10%;">

        </div>
        <div style="text-align: right;width: 400px;">
            <span style="color: blue;">Librerias GetManufacturerInfo <span>
            <br>
            <span>Serial <span><input type="text" id="SerialNumber" name="serial"  >
            <br>
            <span>Ip   <span><input type="text" id="ipAddress" name="ip" class="info-label">
            <br>
            <span>Modelo dispositivo <span> <input type="text" id="productNumber" name="product" >
            <br> 
            <span>Nombre modelo <span> <input type="text" id="modelName" name="Modelo">  
            <br>
            <span>Mac <span> <input type="text" id="macAddress" name="Mac">
            <br>
            <span>Hostname<span> <input type="text" id="hostName" name="hostName">
            <br>
            <span>Firmware<span> <input type="text" id="firmwareVersion" name="firmwareVersion">
            <br>
            <span>Id device<span> <input type="text" id="deviceId" name="deviceId">
            <br>
            <span>Formarter<span> <input type="text" id="formatterSerialNumber" name="formatterSerialNumber">

            <br>
<br>
            <span>Libreria GetCustomerInfo (Informacion del dispositivo) <span>
                <br>
                <span>Persona de contacto <span> <input type="text" id="companyContact" name="contacto">
            <br>
            <span>Nombre de la empresa <span><input type="text" id="companyName" name="empresa">
            <br>
            <span>Ubicacion<span><input type="text" id="deviceLocation" name="direccion">
            <br>
            <span>Alias<span> <input type="text" id="machineName" name="nombre">
            <br>
            <span>Numero activo<span> <input type="text" id="assetNumber" name="assetNumber">
                <br>
        </div>
        <br>
        <input style="position: absolute; left: 40%;" class="button" type="button" value="Cerrar" onClick="window.close()" />
        <br>
        <br>
        <br>
      
    </div>
</body>

</html>
